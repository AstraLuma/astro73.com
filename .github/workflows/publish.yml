
name: Publish on Teahouse

on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

concurrency:
  group: "teahouse"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: ./_site

  # Deployment job
  deploy:
    if: github.repository == 'AstraLuma/astro73.com' && github.ref == 'refs/heads/trunk'
    environment:
      name: teahouse
      url: https://astro73.com
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: ./_site
      - name: Upload
        uses: teahouse-hosting/upload@trunk
        with:
          domain: astro73.com
          root: ./_site
